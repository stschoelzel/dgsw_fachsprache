name: Website bauen und veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Fachsprache auschecken
        uses: actions/checkout@v4
        with:
          path: vault

      - name: Quartz auschecken
        uses: actions/checkout@v4
        with:
          repository: jackyzha0/quartz
          ref: v4 # für Stabilität später auf einen festen Commit setzen
          path: quartz

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Inhalte und Konfiguration übernehmen
        run: |
          rm -rf quartz/content && mkdir -p quartz/content
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.obsidian' \
            --exclude '_quartz' --exclude 'vorlagen' --exclude 'README.md' \
            vault/ quartz/content/
          cp vault/_quartz/quartz.config.ts vault/_quartz/quartz.layout.ts quartz/
          cp vault/_quartz/custom.scss quartz/quartz/styles/custom.scss
          cp -r vault/_quartz/static/fonts quartz/quartz/static/

      - name: Website bauen
        working-directory: quartz
        run: |
          npm ci
          npx quartz build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
